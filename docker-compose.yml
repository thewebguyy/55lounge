version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: servia-postgres
    environment:
      POSTGRES_USER: servia
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: servia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
